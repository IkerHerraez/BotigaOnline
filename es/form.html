<!DOCTYPE html>
<html lang="cat">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="header">
        <h1><a href="index.html">REFUGIO ANIMAL</a></h1>
        <img src="img/logoheader.jpeg" alt="logo" class="logo-header">
        <div class="lang-switch">
            <a href="../form.html">CAT</a>
            <a href="form.html">ES</a>
        </div>
    </div>

    <div class="contenedor formulario-box">
        <h2>Formulario de adopción</h2>
        <form>
            <input type="text" id="nom" name="nom" placeholder="Nombre" required>

            <input type="email" id="email" name="email" placeholder="Email" required>

            <input type="tel" id="telefon" name="telefon" placeholder="Teléfono" required>

            <textarea id="missatge" name="missatge" placeholder="Mensaje" required></textarea>

            <button type="submit" class="btn">Enviar</button>
        </form>
    </div>
    <div class="footer">
        <p>© 2026 Refugio Animal — Todos los derechos reservados</p>
    </div>
</body>

</html>
